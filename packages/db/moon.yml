layer: library
language: typescript
project:
  name: 'db'

tasks:
  generate:
    command: bun run db:generate
    inputs: ['src/schema/**/*', 'drizzle.config.ts', 'package.json']
    outputs: ['migrations/**/*']
  migrate:
    command: bun run db:migrate
    inputs: ['migrations/**/*', 'drizzle.config.ts', 'package.json']
    options:
      cache: false
  push:
    command: bun run db:push
    inputs: ['src/schema/**/*', 'drizzle.config.ts', 'package.json']
    options:
      cache: false
  seed:
    command: bun run db:seed
    inputs: ['scripts/**/*', 'src/**/*', 'package.json']
    options:
      cache: false
  studio:
    command: bun run db:studio
    inputs: ['src/schema/**/*', 'drizzle.config.ts', 'package.json']
    options:
      cache: false
      persistent: true
      runInCI: false
  lint:
    command: bun x biome check .
    inputs: ['src/**/*', 'scripts/**/*', 'drizzle.config.ts', 'biome.json', 'package.json']
  typecheck:
    command: bun x tsc --noEmit
    inputs: ['src/**/*', 'scripts/**/*', 'drizzle.config.ts', 'tsconfig.json', 'package.json', '/tsconfig.options.json']
