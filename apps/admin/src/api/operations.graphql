query AdminSetupStatus {
  adminSetupStatus {
    isRequired
  }
}
query AdminSession {
  adminSession {
    user {
      id
      email
      name
      phone
      role
    }
    expiresAt
  }
}
mutation AdminSetup(
  $secret: String!
  $name: String!
  $phone: String!
  $email: String!
  $password: String!
) {
  adminSetup(secret: $secret, name: $name, phone: $phone, email: $email, password: $password) {
    user {
      id
      email
      name
      phone
      role
    }
    expiresAt
  }
}
mutation AdminLogin($email: String!, $password: String!) {
  adminLogin(email: $email, password: $password) {
    user {
      id
      email
      name
      phone
      role
    }
    expiresAt
  }
}
mutation AdminLogout {
  adminLogout
}
query AdminDashboard {
  adminDashboard {
    todaysOrders
    placedOrders
    processingOrders
    lowStockItems
  }
}
query AdminProducts($page: Int!, $limit: Int!, $query: String) {
  adminProducts(page: $page, limit: $limit, query: $query) {
    page
    total
    items {
      id
      name
      description
      unit
      mrp
      price
      originalPrice
      markup
      markupType
      imageUrl
      timeBoundSections
      trackInventory
      storeId
      store {
        id
        name
      }
      isActive
      category {
        id
        name
      }
    }
  }
}
query AdminProduct($id: String!) {
  adminProduct(id: $id) {
    id
    name
    description
    unit
    mrp
    price
    originalPrice
    markup
    markupType
    imageUrl
    timeBoundSections
    trackInventory
    storeId
    store {
      id
      name
    }
    isActive
    categoryId
    category {
      id
      name
    }
  }
}
query TimeBoundSections {
  timeBoundSections {
    id
    title
    window
    startHour
    endHour
    isNow
  }
}
query AdminCategories {
  adminCategories {
    id
    name
    slug
    sortOrder
  }
}
mutation CreateAdminProduct(
  $categoryId: String!
  $name: String!
  $description: String
  $unit: String!
  $mrp: Int!
  $price: Int!
  $originalPrice: Int
  $markup: Int
  $markupType: MarkupType
  $imageUrl: String
  $timeBoundSections: [TimeBoundSectionId!]
  $trackInventory: Boolean
  $storeId: String
  $isActive: Boolean
) {
  createAdminProduct(
    categoryId: $categoryId
    name: $name
    description: $description
    unit: $unit
    mrp: $mrp
    price: $price
    originalPrice: $originalPrice
    markup: $markup
    markupType: $markupType
    imageUrl: $imageUrl
    timeBoundSections: $timeBoundSections
    trackInventory: $trackInventory
    storeId: $storeId
    isActive: $isActive
  ) {
    id
  }
}
mutation UpdateAdminProduct(
  $id: String!
  $categoryId: String
  $name: String
  $description: String
  $unit: String
  $mrp: Int
  $price: Int
  $originalPrice: Int
  $markup: Int
  $markupType: MarkupType
  $imageUrl: String
  $timeBoundSections: [TimeBoundSectionId!]
  $trackInventory: Boolean
  $storeId: String
  $isActive: Boolean
) {
  updateAdminProduct(
    id: $id
    categoryId: $categoryId
    name: $name
    description: $description
    unit: $unit
    mrp: $mrp
    price: $price
    originalPrice: $originalPrice
    markup: $markup
    markupType: $markupType
    imageUrl: $imageUrl
    timeBoundSections: $timeBoundSections
    trackInventory: $trackInventory
    storeId: $storeId
    isActive: $isActive
  ) {
    id
  }
}
mutation RegisterAdminDevice($fid: String!, $userAgent: String) {
  registerAdminDevice(fid: $fid, userAgent: $userAgent)
}
mutation UnregisterAdminDevice($fid: String!) {
  unregisterAdminDevice(fid: $fid)
}
mutation CreateAdminCategory($name: String!, $slug: String!, $sortOrder: Int) {
  createAdminCategory(name: $name, slug: $slug, sortOrder: $sortOrder) {
    id
  }
}
mutation UpdateAdminCategory($id: String!, $name: String, $slug: String, $sortOrder: Int) {
  updateAdminCategory(id: $id, name: $name, slug: $slug, sortOrder: $sortOrder) {
    id
  }
}
query AdminStores($type: AdminStoreType) {
  adminStores(type: $type) {
    id
    name
    type
    partnerName
    contactPhone
    contactEmail
    commissionPct
    address
    lat
    lng
    serviceRadiusM
    isActive
  }
}
query AdminStore($id: String!) {
  adminStore(id: $id) {
    id
    name
    type
    partnerName
    contactPhone
    contactEmail
    commissionPct
    address
    lat
    lng
    serviceRadiusM
    isActive
  }
}
mutation CreateAdminStore(
  $name: String!
  $type: AdminStoreType
  $partnerName: String
  $contactPhone: String
  $contactEmail: String
  $commissionPct: Int
  $address: String!
  $lat: Float!
  $lng: Float!
  $serviceRadiusM: Int
  $isActive: Boolean
) {
  createAdminStore(
    name: $name
    type: $type
    partnerName: $partnerName
    contactPhone: $contactPhone
    contactEmail: $contactEmail
    commissionPct: $commissionPct
    address: $address
    lat: $lat
    lng: $lng
    serviceRadiusM: $serviceRadiusM
    isActive: $isActive
  ) {
    id
  }
}
mutation BulkCreateAdminStores($stores: [AdminStoreInput!]!) {
  bulkCreateAdminStores(stores: $stores) {
    id
    name
    type
  }
}
mutation UpdateAdminStore(
  $id: String!
  $name: String
  $type: AdminStoreType
  $partnerName: String
  $contactPhone: String
  $contactEmail: String
  $commissionPct: Int
  $address: String
  $lat: Float
  $lng: Float
  $serviceRadiusM: Int
  $isActive: Boolean
) {
  updateAdminStore(
    id: $id
    name: $name
    type: $type
    partnerName: $partnerName
    contactPhone: $contactPhone
    contactEmail: $contactEmail
    commissionPct: $commissionPct
    address: $address
    lat: $lat
    lng: $lng
    serviceRadiusM: $serviceRadiusM
    isActive: $isActive
  ) {
    id
  }
}
query AdminInventory(
  $storeId: String!
  $page: Int!
  $limit: Int!
  $query: String
  $lowStockOnly: Boolean!
) {
  adminInventory(
    storeId: $storeId
    page: $page
    limit: $limit
    query: $query
    lowStockOnly: $lowStockOnly
  ) {
    page
    limit
    total
    items {
      id
      stockQty
      lowStockThreshold
      updatedAt
      product {
        id
        name
        imageUrl
      }
    }
  }
}
mutation AdjustAdminInventory($inventoryId: String!, $delta: Int!, $reason: String!) {
  adjustAdminInventory(inventoryId: $inventoryId, delta: $delta, reason: $reason) {
    id
    stockQty
  }
}
query AdminOrders($page: Int!, $limit: Int!, $status: AdminOrderStatus) {
  adminOrders(page: $page, limit: $limit, status: $status) {
    page
    limit
    total
    items {
      id
      status
      total
      placedAt
      customer {
        id
        name
        email
        phone
      }
      store {
        id
        name
      }
    }
  }
}
query AdminOrder($id: String!) {
  adminOrder(id: $id) {
    id
    status
    subtotal
    deliveryFee
    discount
    total
    paymentMethod
    placedAt
    customer {
      id
      name
      email
      phone
    }
    store {
      id
      name
    }
    address {
      line1
      line2
      city
      pincode
    }
    items {
      id
      name
      unit
      unitPrice
      mrp
      quantity
    }
    history {
      fromStatus
      toStatus
      reason
      createdAt
    }
    allowedNextStatuses
  }
}
mutation TransitionAdminOrder($orderId: String!, $status: AdminOrderStatus!, $reason: String) {
  transitionAdminOrder(orderId: $orderId, status: $status, reason: $reason) {
    id
    status
  }
}
query AdminCustomers($page: Int!, $limit: Int!, $query: String) {
  adminCustomers(page: $page, limit: $limit, query: $query) {
    page
    limit
    total
    items {
      id
      name
      phone
      email
      role
      createdAt
      updatedAt
    }
  }
}
query AdminCustomer($id: String!) {
  adminCustomer(id: $id) {
    id
    name
    phone
    email
    role
    createdAt
    updatedAt
  }
}
mutation UpdateAdminCustomer($id: String!, $name: String, $phone: String, $email: String) {
  updateAdminCustomer(id: $id, name: $name, phone: $phone, email: $email) {
    id
    name
    phone
    email
  }
}
