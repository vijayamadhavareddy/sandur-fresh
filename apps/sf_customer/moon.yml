id: 'sf_customer'
language: 'dart'

fileGroups:
  sources:
    - 'lib/**/*'
    - 'pubspec.yaml'

tasks:
  run:
    command: 'flutter run'
  get:
    command: 'flutter pub get'
    inputs: ['pubspec.yaml']
  analyze:
    command: 'flutter analyze'
    inputs: ['@globs(sources)']
  test:
    command: 'flutter test'
    inputs: ['@globs(sources)', 'test/**/*']
  build-apk:
    command: 'flutter build apk --release'
    inputs: ['@globs(sources)']
    outputs: ['build/app/outputs']
  fastlane-android-bundle:
    command: 'bundle exec fastlane android build_bundle'
    inputs: ['@globs(sources)', 'android/**/*', 'fastlane/**/*']
    outputs: ['build/app/outputs/bundle']
  fastlane-android-beta:
    command: 'bundle exec fastlane android beta'
    inputs: ['@globs(sources)', 'android/**/*', 'fastlane/**/*']
  fastlane-ios-beta:
    command: 'bundle exec fastlane ios beta'
    inputs: ['@globs(sources)', 'ios/**/*', 'fastlane/**/*']

