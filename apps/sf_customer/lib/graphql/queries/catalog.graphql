fragment ProductFields on ProductsSelectItem {
  id
  categoryId
  name
  description
  unit
  mrp
  price
  emoji
  imageUrl
  timeBoundSection
  isActive
}

fragment CategoryFields on CategoriesSelectItem {
  id
  name
  slug
  sortOrder
}

fragment TimeBoundSectionFields on TimeBoundSection {
  id
  title
  window
  startHour
  endHour
  isNow
}

query GetCatalog {
  products(limit: 100) {
    ...ProductFields
  }
  categories(limit: 100) {
    ...CategoryFields
  }
  timeBoundSections {
    ...TimeBoundSectionFields
  }
}
